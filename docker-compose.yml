services:

  # ── PHP / Apache application ──────────────────────────────────────────────
  app:
    image: ${APP_IMAGE}
    container_name: fablofree/garage-lingiah
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8081}:80"
    environment:
      DB_DRIVER: pgsql
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5433}
      DB_DATABASE: ${DB_DATABASE:-garage_lingiah}
      DB_USERNAME: ${DB_USERNAME:-fab}
      DB_PASSWORD: ${DB_PASSWORD:-4h4jirgu9d2dF}
      APP_DEBUG: ${APP_DEBUG:-false}
    networks:
      - garage_net

networks:
  garage_net:
    driver: bridge
