<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- Background -->
  <rect width="80" height="80" rx="12" fill="#1e293b"/>

  <!-- Gear teeth (8 rotated rectangles) -->
  <g transform="translate(40,36)">
    <rect x="-4" y="-24" width="8" height="9" rx="2" fill="#f97316"/>
    <rect x="-4" y="-24" width="8" height="9" rx="2" fill="#f97316" transform="rotate(45)"/>
    <rect x="-4" y="-24" width="8" height="9" rx="2" fill="#f97316" transform="rotate(90)"/>
    <rect x="-4" y="-24" width="8" height="9" rx="2" fill="#f97316" transform="rotate(135)"/>
    <rect x="-4" y="-24" width="8" height="9" rx="2" fill="#f97316" transform="rotate(180)"/>
    <rect x="-4" y="-24" width="8" height="9" rx="2" fill="#f97316" transform="rotate(225)"/>
    <rect x="-4" y="-24" width="8" height="9" rx="2" fill="#f97316" transform="rotate(270)"/>
    <rect x="-4" y="-24" width="8" height="9" rx="2" fill="#f97316" transform="rotate(315)"/>
    <!-- Gear body -->
    <circle r="17" fill="#f97316"/>
    <!-- Inner hole -->
    <circle r="9.5" fill="#1e293b"/>
    <!-- Centre hub -->
    <circle r="3.5" fill="#f97316"/>
  </g>

  <!-- GL monogram -->
  <text
    x="40" y="70"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    font-size="13"
    font-weight="900"
    text-anchor="middle"
    fill="#f97316"
    letter-spacing="3">GL</text>
</svg>
