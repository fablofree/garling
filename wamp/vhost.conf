# Garage A. Lingiah — WampServer Virtual Host
#
# HOW TO ACTIVATE:
# 1. Open WampServer tray icon → Apache → httpd-vhosts.conf
# 2. Paste this block at the end of that file
# 3. Adjust DocumentRoot and Directory paths to match where you placed the project
# 4. Tray icon → Apache → Restart
# 5. If using a custom ServerName (e.g. garling.local), add it to:
#    C:\Windows\System32\drivers\etc\hosts
#    →  127.0.0.1  garling.local
#
# Make sure mod_rewrite is enabled:
#    WampServer tray → Apache → Apache modules → rewrite_module ✓

# ── Option A: run at http://localhost/ ───────────────────────────────────────
# (replaces the default localhost site)
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "C:/wamp64/www/garling/public"

    <Directory "C:/wamp64/www/garling/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  "C:/wamp64/logs/garling-error.log"
    CustomLog "C:/wamp64/logs/garling-access.log" combined
</VirtualHost>

# ── Option B: run at http://garling.local/ ───────────────────────────────────
# (keeps http://localhost/ for other projects)
# Uncomment below and add "127.0.0.1  garling.local" to your hosts file.
#
# <VirtualHost *:80>
#     ServerName garling.local
#     DocumentRoot "C:/wamp64/www/garling/public"
#
#     <Directory "C:/wamp64/www/garling/public">
